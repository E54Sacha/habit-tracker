# Local development database. Start it with: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: habits
      POSTGRES_DB: habits
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the second database used by the tests (habits_test).
      - ./api/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
