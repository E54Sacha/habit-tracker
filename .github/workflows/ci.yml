name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # A real PostgreSQL for the tests, same major version as docker-compose.yml and Neon.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: habits
          POSTGRES_DB: habits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habits"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://habits:habits@localhost:5432/habits_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the tests with coverage
        run: pytest --cov --cov-report=term --cov-fail-under=80
      - name: Make the coverage badge
        run: |
          coverage json -o coverage.json
          python ../.github/scripts/coverage_badge.py coverage.json coverage.svg
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: api/coverage.svg

  web:
    name: Front end lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: habits
          POSTGRES_DB: habits
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habits"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t habit-tracker-api api
      - name: Start it like Render does (production settings, migrations on start)
        run: |
          docker run -d --name api --network host \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql://habits:habits@localhost:5432/habits \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e COOKIE_SECURE=true -e ENVIRONMENT=production \
            habit-tracker-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1

  e2e:
    name: End-to-end test (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: habits
          POSTGRES_DB: habits
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habits"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://habits:habits@localhost:5432/habits
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API
        working-directory: api
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Build the site and install the browser
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  badge:
    # Publishes the coverage badge to the "badges" branch, only for green pushes to main.
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, docker, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - name: Push coverage.svg to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
