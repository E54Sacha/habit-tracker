name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # A real PostgreSQL for the tests, same major version as docker-compose.yml.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: habits
          POSTGRES_DB: habits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habits"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://habits:habits@localhost:5432/habits_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the tests with coverage
        run: pytest --cov --cov-report=term --cov-fail-under=80

  web:
    name: Front end lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
